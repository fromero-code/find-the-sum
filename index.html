<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidden Sum Game</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    text-align:center;
    margin:20px;
}

#levelDisplay{
    font-size:1.2rem;
    font-weight:bold;
    margin-bottom:10px;
}

#highScore{
    font-size:1.3rem;
    font-weight:bold;
    color:#1565c0;
    margin:10px;
}

#timer{
    font-size:1.4rem;
    font-weight:bold;
    color:#d32f2f;
    margin:10px;
}

  #scorePoints{
    font-size:1.3rem;
    font-weight:bold;
    color:#f57c00;
    margin:10px;
}

#score{
    margin:10px;
    font-size:1.2rem;
}

button{
    padding:10px 20px;
    font-size:1rem;
    cursor:pointer;
    margin-bottom:15px;
}

#game{
    width:900px;
    max-width:100%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.puzzle{
    background:white;
    border:4px solid black;
    aspect-ratio:1;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
}

.cell{
    display:flex;
    justify-content:center;
    align-items:center;

    border:1px solid #999;

    font-size:1.8rem;
    font-weight:bold;

    cursor:pointer;
    user-select:none;
}

.cell:hover{
    background:#eef7ff;
}

.selected{
    background:gold;
}

.solved{
    grid-column:1/4;
    grid-row:1/4;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#4caf50;
    color:white;

    font-size:5rem;
    font-weight:bold;
}

.failed{
    grid-column:1/4;
    grid-row:1/4;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c62828;
    color:white;

    text-align:center;

    font-size:2.5rem;
    font-weight:bold;
}



.finalBoard{
    width:900px;
    max-width:100%;
    aspect-ratio:1;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    border:6px solid black;
    background:white;
}

.finalWinner{
    width:900px;
    max-width:100%;
    height:70vh;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#4caf50;
    color:white;

    font-size:8rem;
    font-weight:bold;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(0) rotate(0deg);
    }
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<h1>🔍 Hidden Sum Game</h1>

<div id="levelDisplay">Current Level: 1</div>

  <label for="difficulty">Difficulty:</label>

<select id="difficulty">
    <option value="easy">Easy (1-20)</option>
    <option value="medium">Medium (1-40)</option>
    <option value="hard">Hard (1-60)</option>
</select>

<button onclick="resetGame()">🔄 New Game</button>

  <button onclick="showResetConfirm()">
🏆 Reset Best Score
</button>

<div id="resetConfirmArea"></div>

<div id="timer">⏰ Time Left: 300</div>

<div id="scorePoints">⭐ Score: 0</div>

<div id="highScore">🏆 Best Score: 0</div>

<div id="score">Solved: 0 / 9</div>

<div id="message">
Find the two numbers that add to another number in the grid.
</div>

<div id="game"></div>

<script>

const game = document.getElementById("game");

let puzzles = [];
let solvedCount = 0;
let currentLevel = 1;
let finalPuzzle = null;
let timerInterval;
let timeLeft = 300;
let score = 0;
let bossBonus = 0;
let highScore = 0;
let maxNumber = 20;

function shuffle(arr){
    const copy = [...arr];

    for(let i=copy.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [copy[i],copy[j]] = [copy[j],copy[i]];
    }

    return copy;
}

function hasExactlyOneSolution(numbers){

    let count = 0;

    for(let i=0;i<numbers.length;i++){
        for(let j=i+1;j<numbers.length;j++){

            const target =
            numbers[i] + numbers[j];

            for(let k=0;k<numbers.length;k++){

                if(
                    k!==i &&
                    k!==j &&
                    numbers[k]===target
                ){
                    count++;
                }
            }
        }
    }

    return count === 1;
}

function createPuzzle(){

    while(true){

     const a =
Math.floor(Math.random()*maxNumber)+1;

const b =
Math.floor(Math.random()*maxNumber)+1;   

        let sum = a+b;

      if(sum > maxNumber){
    continue;
}

        let numbers = [a,b,sum];

        while(numbers.length < 9){

         const fake =
Math.floor(Math.random()*maxNumber)+1;  

            if(!numbers.includes(fake)){
                numbers.push(fake);
            }
        }

        if(hasExactlyOneSolution(numbers)){

            return{
                numbers:shuffle(numbers),
                a,b,sum
            };
        }
    }
}

function startTimer(){

    clearInterval(timerInterval);

    timeLeft = 300;

    timerInterval = setInterval(()=>{

        timeLeft--;

        document.getElementById("timer").textContent =
        `⏰ Time Left: ${timeLeft}`;

        if(timeLeft <= 0){

            clearInterval(timerInterval);

            if(currentLevel === 1){
                revealLevel1Answers();
            }
        }

    },1000);
}

function buildLevel1(){

    game.innerHTML = "";

    puzzles.forEach(puzzle=>{

        const board =
        document.createElement("div");

        board.className="puzzle";

        let selected=[];

        puzzle.numbers.forEach(number=>{

            const cell =
            document.createElement("div");

            cell.className="cell";
            cell.textContent=number;

            cell.addEventListener("click",()=>{

                if(board.dataset.solved) return;

                if(cell.classList.contains("selected"))
                return;

                selected.push(number);
                cell.classList.add("selected");

                if(selected.length===2){

                    const correct =
                    (selected[0]===puzzle.a &&
                     selected[1]===puzzle.b) ||

                    (selected[1]===puzzle.a &&
                     selected[0]===puzzle.b);

                    if(correct){

                        solvedCount++;

                        score += 10;

    document.getElementById("scorePoints").textContent =
    `⭐ Score: ${score}`;

                        document.getElementById("score")
                        .textContent =
                        `Solved: ${solvedCount} / 9`;

                        board.innerHTML =
                        `<div class="solved">${puzzle.sum}</div>`;

                        board.dataset.solved=true;

                        if(solvedCount===9){
                            setTimeout(
                                showFinalPuzzle,
                                500
                            );
                        }

                    }else{

                        setTimeout(()=>{

                            selected=[];

                            board.querySelectorAll(".selected")
                            .forEach(c=>
                                c.classList.remove("selected")
                            );

                        },250);
                    }
                }

            });

            board.appendChild(cell);

        });

        game.appendChild(board);

    });
}

function showFinalPuzzle(){

    // Save remaining time if you use it for scoring
    bossBonus = timeLeft;

    // Stop timer
    clearInterval(timerInterval);

    currentLevel = 2;

    document.getElementById("levelDisplay")
    .textContent =
    "Current Level: 2";

    document.getElementById("timer")
    .style.color =
    "green";

    document.getElementById("timer")
    .textContent =
    "👑 Boss Level - No Time Limit";

    document.getElementById("score")
    .textContent =
    "👑 Boss Puzzle";
 const answers =
  puzzles.map(p => p.sum);

    let a, b, sum;

for(let i=0;i<answers.length;i++){

    for(let j=i+1;j<answers.length;j++){

        const target =
        answers[i] + answers[j];

        if(answers.includes(target)){

            a = answers[i];
            b = answers[j];
            sum = target;

            break;
        }
    }

    if(sum) break;
}

let numbers = [...answers];




    finalPuzzle = {
    a,
    b,
    sum,
    numbers
};


    game.innerHTML = "";

    const board =
    document.createElement("div");

    board.className = "finalBoard";

    let selected = [];

    finalPuzzle.numbers.forEach(number=>{

        const cell =
        document.createElement("div");

        cell.className = "cell";
        cell.style.fontSize = "3rem";
        cell.textContent = number;

        cell.addEventListener("click",()=>{

            if(selected.length >= 2){
                return;
            }

            if(cell.classList.contains("selected")){
                return;
            }

            selected.push(number);

            cell.classList.add("selected");

            if(selected.length === 2){

                const correct =
                (selected[0] === a &&
                 selected[1] === b) ||

                (selected[1] === a &&
                 selected[0] === b);

                if(correct){

                    score += 50;
                    score += bossBonus;

                  // Difficulty multiplier
    if(maxNumber === 40){
        score = Math.round(score * 1.5);
    }
    else if(maxNumber === 60){
        score = score * 2;
    }

                    document.getElementById("scorePoints")
                    .textContent =
                    `⭐ Score: ${score}`;

                    if(score > highScore){

                        highScore = score;

                        document.getElementById("highScore")
                        .textContent =
                        `🏆 Best Score: ${highScore}`;
                    }

                    celebrate();

                    document.getElementById("levelDisplay")
                    .textContent =
                    "🏆 Completed";

                    game.innerHTML =
                    `<div class="finalWinner">
                    🏆 ${sum}
                    </div>`;

                }else{

                    setTimeout(()=>{

                        selected = [];

                        board
                        .querySelectorAll(".selected")
                        .forEach(c =>
                            c.classList.remove("selected")
                        );

                    },250);
                }
            }
        });

        board.appendChild(cell);

    });

    game.appendChild(board);
}

function revealLevel1Answers(){

    clearInterval(timerInterval);

    document.getElementById("message")
    .textContent =
    `⏰ Time Up! You solved ${solvedCount} out of 9 puzzles.`;

    const boards =
    document.querySelectorAll(".puzzle");

    boards.forEach((board,index)=>{

        if(board.dataset.solved){
            return;
        }

        const puzzle = puzzles[index];

        board.innerHTML = "";

        const reveal =
        document.createElement("div");

        reveal.className = "failed";

        reveal.innerHTML =
        `
        <div>
            ${puzzle.a}
            +
            ${puzzle.b}
            <br>
            =
            <br>
            ${puzzle.sum}
        </div>
        `;

        board.appendChild(reveal);

    });
}


function revealLevel2Answer(){

    game.innerHTML =
    `<div class="finalWinner"
    style="background:#c62828;font-size:3rem;">
    ⏰ TIME UP<br><br>
    ${finalPuzzle.a} + ${finalPuzzle.b} = ${finalPuzzle.sum}
    </div>`;
}

function celebrate(){

    for(let i=0;i<250;i++){

        const dot =
        document.createElement("div");

        dot.className="confetti";

        dot.style.left =
        Math.random()*100 + "vw";

        dot.style.background =
        `hsl(${Math.random()*360},100%,50%)`;

        dot.style.animationDuration =
        (Math.random()*3+2)+"s";

        document.body.appendChild(dot);

        setTimeout(()=>{
            dot.remove();
        },5000);
    }
}

function showResetConfirm(){

    document.getElementById("resetConfirmArea")
    .innerHTML = `
        <button onclick="resetHighScore()">
            ✅ Confirm Reset
        </button>

        <button onclick="cancelReset()">
            ❌ Cancel
        </button>
    `;
}

function resetHighScore(){

    highScore = 0;

    document.getElementById("highScore")
    .textContent =
    "🏆 Best Score: 0";

    document.getElementById("resetConfirmArea")
    .innerHTML = "";
}

function cancelReset(){

    document.getElementById("resetConfirmArea")
    .innerHTML = "";
}


function resetGame(){

  const difficulty =
document.getElementById("difficulty").value;

let difficultyText = "";

if(difficulty === "easy"){
    maxNumber = 20;
    difficultyText = "Easy";
}
else if(difficulty === "medium"){
    maxNumber = 40;
    difficultyText = "Medium";
}
else{
    maxNumber = 60;
    difficultyText = "Hard";
}

    clearInterval(timerInterval);

    puzzles=[];
    solvedCount=0;
    score = 0;
    currentLevel=1;
    finalPuzzle=null;

   document.getElementById("scorePoints").textContent =
"⭐ Score: 0";

    document.getElementById("levelDisplay")
    .textContent =
    "Current Level: 1";

  document.getElementById("timer").style.color =
"#d32f2f";

    document.getElementById("timer")
    .textContent =
    "⏰ Time Left: 300";

    document.getElementById("score")
    .textContent =
    "Solved: 0 / 9";

    document.getElementById("message").textContent =
`${difficultyText} Mode | Find the two numbers that add to another number in the grid.`;

    while(true){

    puzzles = [];

    for(let i=0;i<9;i++){
        puzzles.push(createPuzzle());
    }

    const answers =
    puzzles.map(p => p.sum);

    let bossCount = 0;

    for(let i=0;i<answers.length;i++){

        for(let j=i+1;j<answers.length;j++){

            const target =
            answers[i] + answers[j];

            if(answers.includes(target)){
                bossCount++;
            }
        }
    }

    if(bossCount === 1){
        break;
    }
}


    buildLevel1();
    startTimer();
}

resetGame();

</script>

</body>
</html>
